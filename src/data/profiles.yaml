research:
  label: "Paper · Submitted to ACM 2026"
  title: "An Analysis of Factors Affecting LLM-based Phishing Detection"
  summary: >-
    As a contributor to this research, I reviewed 655 emails to produce a
    dataset of 160 emails for the paper:
    - 80 of which where Phishing emails
    - 80 were benign emails

    Each email was classified as one of 3 types of obfuscation technique:
    - Insert Word
    - Distrupt Word
    - Add Paragraph

    To make labelling faster I made a custom labelling app using a streamlit UI.
    This increased labelling speed per email by ~4x as it saved time on opening
    and closing files.
