projects:
  - name: "Judo Clipper"
    slug: "judo-clipper"
    tagline: "An AI-powered video-analysis system that uses YOLO pose-estimation outputs as input to a custom LSTM model, automatically identifying and extracting throw-attempt clips from full judo matches."
    icon: "/images/judo_clipper_project_icon.png"
    tech:
      - "PyTorch"
      - "Python"
      - "Ultralytics YOLO v11"
      - "AWS S3"
      - "FastAPI"
      - "Modal"
      - "Vercel"
    links:
      - label: "Visit website"
        url: "https://www.judoclipper.com/"
        type: "webapp"
        primary: true
      - label: "System repo"
        url: "https://github.com/Coshea46/ai-judo-coach-system"
        type: "github"
      - label: "Research repo"
        url: "https://github.com/Coshea46/ai-judo-coach-research-clean"
        type: "github"
      - label: "Write-up"
        url: "/blog/judo-clipper"
        type: "blog"

